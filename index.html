<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Portes Atelier</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --txt:#f2f2f2; --mut:#8e8e93;
          --open:#30d158; --close:#0a84ff; --stop:#ff453a; --warn:#ff9f0a; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:16px -apple-system, system-ui, sans-serif; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  #conn { width:100%; padding:16px; font-size:18px; border:0; border-radius:14px;
          background:var(--close); color:#fff; font-weight:600; }
  #status { color:var(--mut); margin:10px 2px 16px; min-height:20px; }
  .door { background:var(--card); border-radius:18px; padding:16px; margin-bottom:16px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .name { font-weight:600; font-size:18px; }
  .badge { padding:4px 10px; border-radius:20px; font-size:14px; background:#333; }
  .badge.open { background:var(--open); color:#000; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button.act { padding:26px 0; font-size:20px; font-weight:700; border:0; border-radius:14px;
               color:#fff; touch-action:none; }
  button.act:disabled { opacity:.35; }
  .o { background:var(--open); color:#000; }
  .c { background:var(--close); }
  .c.hold.pressing { background:var(--warn); color:#000; }
  .s { background:var(--stop); grid-column:1 / span 2; }
  .hint { color:var(--mut); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<h1>Portes atelier <small style="color:#8e8e93;font-size:14px">v8</small></h1>
<button id="conn">Se connecter</button>
<div id="status">Appuie sur « Se connecter » ou directement sur Ouvrir.</div>
<div id="doors"></div>

<script>
const SVC   = "6f1d0001-7b3a-4c2e-9a51-2c0a8e5d4b10";
const CMD   = "6f1d0002-7b3a-4c2e-9a51-2c0a8e5d4b10";
const STATE = "6f1d0003-7b3a-4c2e-9a51-2c0a8e5d4b10";
const C = { OPEN:1, CLOSE:2, STOP:3, HOLD:4, RELEASE:5 };
const NAMES = ["Porte 1", "Porte 2"];

let device, cmdChr, stateChr, chain = Promise.resolve(), connecting = null;
// une tentative bloquée ne doit jamais figer les boutons
const delai = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("délai dépassé")), ms))]);
let holdFlags = [true, true];
const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;

// Connexion : la liste Bluetooth doit s'ouvrir DIRECTEMENT sur l'appui (exigence iOS/Bluefy),
// donc requestDevice est appelé en tout premier, sans rien attendre avant.
function ensureConnected(allowChooser) {
  if (cmdChr) return Promise.resolve(true);
  if (connecting) return connecting;
  if (!navigator.bluetooth) { setStatus("Ouvre cette page dans l'app Bluefy."); return Promise.resolve(false); }
  if (!device && !allowChooser) return Promise.resolve(false);
  const choix = device ? Promise.resolve(device)
                       : navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SVC] });
  connecting = (async () => {
    try {
      setStatus("Choisis Atelier-Portes dans la liste…");
      const d = await choix;
      if (d !== device) { device = d; device.addEventListener("gattserverdisconnected", onDisconnected); }
      setStatus("Connexion…");
      const server = await delai(device.gatt.connect(), 8000);
      const svc = await server.getPrimaryService(SVC);
      cmdChr   = await svc.getCharacteristic(CMD);
      stateChr = await svc.getCharacteristic(STATE);
      showState(await delai(stateChr.readValue(), 30000));   // 30 s : le temps de taper le PIN
      await stateChr.startNotifications();
      stateChr.addEventListener("characteristicvaluechanged", e => showState(e.target.value));
      $("conn").textContent = "Connecté ✓";
      setStatus("Prêt.");
      return true;
    } catch (e) {
      setStatus("Pas de connexion : " + e.message + " – réessaie");
      try { device && device.gatt.connected && device.gatt.disconnect(); } catch (_) {}
      device = null;          // appareil "périmé" : au prochain appui, nouvelle liste
      $("conn").textContent = "Se connecter";
      return false;
    } finally { connecting = null; }
  })();
  return connecting;
}

function onDisconnected() {
  cmdChr = stateChr = null;
  device = null;              // après une coupure, on repart d'une connexion neuve
  $("conn").textContent = "Se connecter";
  setStatus("Hors de portée – reconnexion au prochain appui.");
}

// écritures sérialisées ; se connecte d'abord si besoin
async function send(door, cmd) {
  if (!cmdChr && !(await ensureConnected(true))) return;   // ensureConnected ouvre la liste immédiatement
  chain = chain.then(() => cmdChr && cmdChr.writeValueWithResponse(new Uint8Array([door, cmd])))
               .then(() => { if (cmd === C.OPEN) setStatus("Ouverture envoyée ✓"); })
               .catch(e => setStatus("Erreur : " + e.message));
}

function render() {
  const wrap = $("doors"); wrap.innerHTML = "";
  NAMES.forEach((n, i) => {
    const hold = holdFlags[i];
    wrap.insertAdjacentHTML("beforeend", `
      <div class="door">
        <div class="head"><span class="name">${n}</span>
          <span class="badge" id="b${i}">—</span></div>
        <div class="row">
          <button class="act o" id="o${i}">Ouvrir</button>
          <button class="act c ${hold ? "hold" : ""}" id="c${i}">
            ${hold ? "Maintenir<br>pour fermer" : "Fermer"}</button>
          <button class="act s" id="s${i}">STOP</button>
        </div>
        ${hold ? '<div class="hint">Homme mort : la porte s\'arrête dès que tu lâches.</div>' : ""}
      </div>`);
    $("o"+i).onclick = () => send(i, C.OPEN);
    $("s"+i).onclick = () => send(i, C.STOP);
    hold ? bindHold($("c"+i), i) : $("c"+i).onclick = () => send(i, C.CLOSE);
  });
}

function bindHold(btn, i) {
  let timer = null;
  const start = async e => {
    if (timer) return;
    const pret = cmdChr ? true : ensureConnected(true);   // appelé tout de suite, dans le geste
    btn.classList.add("pressing");
    if (!(await pret)) { btn.classList.remove("pressing"); return; }
    if (!btn.classList.contains("pressing")) return;   // doigt déjà levé pendant la connexion
    send(i, C.HOLD);
    timer = setInterval(() => send(i, C.HOLD), 150);
  };
  const stop = () => {
    btn.classList.remove("pressing");
    if (!timer) return;
    clearInterval(timer); timer = null;
    send(i, C.RELEASE);
  };
  btn.addEventListener("pointerdown", start);
  ["pointerup","pointercancel","pointerleave","lostpointercapture"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("visibilitychange", stop);
  window.addEventListener("blur", stop);
}

function showState(dv) {
  const open = [dv.getUint8(0), dv.getUint8(1)];
  const hold = [!!dv.getUint8(2), !!dv.getUint8(3)];
  if (hold[0] !== holdFlags[0] || hold[1] !== holdFlags[1]) { holdFlags = hold; render(); }
  open.forEach((o, i) => {
    const b = $("b"+i);
    if (o === 2) { b.textContent = "État non câblé"; b.className = "badge"; return; }
    b.textContent = o ? "Ouverte" : "Pas ouverte";
    b.className = "badge" + (o ? " open" : "");
  });
}

$("conn").onclick = () => ensureConnected(true);
render();
// retour dans l'appli : reconnexion silencieuse à l'atelier déjà choisi
document.addEventListener("visibilitychange", () => { if (!document.hidden) ensureConnected(false); });
</script>
</body>
</html>
